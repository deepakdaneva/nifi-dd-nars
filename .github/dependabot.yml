# Weekly dependency updates, raised against development (the integration branch).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Maven 3.10 breaks authenticated uploads to the Central snapshot repository; stay on 3.9.x
      - dependency-name: "org.apache.maven:apache-maven"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Keep nifi-api aligned with the NiFi framework version (nifi.version); upgrade both together
      - dependency-name: "org.apache.nifi:nifi-api"
      # Tika 4 needs a dedicated migration
      - dependency-name: "org.apache.tika:tika-bom"
        update-types: ["version-update:semver-major"]
      # The netCDF/GRIB parser's generated classes need the protobuf 3 API
      - dependency-name: "com.google.protobuf:protobuf-java"
        update-types: ["version-update:semver-major"]
    groups:
      maven-plugins:
        patterns: ["org.apache.maven.plugins:*", "*-maven-plugin"]
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
